<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a3a2a" />
    <title>GreenHerb — Gestão de Estufa</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header class="topbar" role="banner">
      <div class="topbar-left">
        <a class="logo" href="#dashboard" aria-label="GreenHerb — início">
          <svg
            class="logo-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M12 21c0-5 2-9 8-12-1 7-4 11-8 12zm0 0c0-4-1-7-5-9 0 5 2 8 5 9z"
              fill="currentColor"
            />
          </svg>
          <span class="logo-texto">
            <span class="logo-green">Green</span><span class="logo-herb">Herb</span>
          </span>
        </a>
      </div>

      <nav class="breadcrumb" aria-label="Localização atual">
        <ol id="breadcrumb-lista">
          <li>Gestão</li>
          <li aria-current="page">Planos</li>
        </ol>
      </nav>

      <div class="topbar-right">
        <span
          class="estado-ligacao"
          id="estado-ligacao"
          role="status"
          aria-live="polite"
        >
          <svg
            class="icone-wifi"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M5 12.55a11 11 0 0114 0M8.5 16.05a6 6 0 017 0M12 20h.01M2 8.82a15 15 0 0120 0"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="estado-texto">Online</span>
        </span>

        <div
          class="avatar"
          aria-label="Utilizador"
          title="Utilizador"
        >
          TP
        </div>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" aria-label="Navegação principal">
        <nav>
          <div class="grupo-nav">
            <ul>
              <li>
                <a href="#dashboard" data-rota="dashboard">
                  <i class="ti ti-layout-dashboard" aria-hidden="true"></i>
                  Dashboard
                </a>
              </li>
            </ul>
          </div>

          <div class="grupo-nav">
            <p class="grupo-titulo">Gestão</p>
            <ul>
              <li>
                <a href="#planos" data-rota="planos">Planos</a>
              </li>
              <li>
                <a href="#lotes" data-rota="lotes">Lotes</a>
              </li>
              <li>
                <a href="#medicoes" data-rota="medicoes">Medições</a>
              </li>
            </ul>
          </div>

          <div class="grupo-nav">
            <p class="grupo-titulo">Sistema</p>
            <ul>
              <li>
                <a href="#alertas" data-rota="alertas">Alertas</a>
              </li>
              <li>
                <a href="#relatorios" data-rota="relatorios">Relatórios</a>
              </li>
              <li>
                <a href="#auditoria" data-rota="auditoria">Auditoria</a>
              </li>
              <li class="apenas-admin" hidden>
                <a href="#utilizadores" data-rota="utilizadores">Utilizadores</a>
              </li>
            </ul>
          </div>
        </nav>
      </aside>

      <main id="conteudo" class="conteudo" tabindex="-1">
        <p class="aviso-carregamento">A carregar…</p>
      </main>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
